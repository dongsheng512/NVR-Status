[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "cli_report",
    "config_store",
    "hikvision_status",
    "run_gui",
]
packages = ["ui", "ui.panels", "ui.widgets", "services", "nvr_core"]

[project]
name = "cam"
version = "2.3.0"
description = "海康 NVR 状态巡检与音视频抽检（CLI + GUI）"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32.5",
    "PySide6~=6.8.0",
    "rich>=15.0.0",
]

[project.scripts]
nvr-gui = "ui.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    # 打包用。放 dev 组而不是 optional extra:uv sync 默认装 dev 组,
    # 否则每次 sync 会把 pip 手装的 pyinstaller 清掉,打包脚本就得补救
    "pyinstaller>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
